# .github/workflows/docker.yml
# Builds the offline image (Whisper base.en baked in from Hugging Face) and runs, inside it:
# the real-weights Whisper test, the full test suite and the demo; then scores the bench with
# kit transcripts/labels and with raw media only (speech from espeak-ng, text-bearing frames).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t theme5 .

      - name: Whisper test (real weights)
        run: |
          docker run --rm -e THEME5_TEST_WHISPER=1 theme5 \
            python -m pytest -q -rA -p no:cacheprovider tests/test_multimodal.py | tee whisper.log
          # the real-model test is skipped silently without weights; require it to have run
          grep -q "PASSED tests/test_multimodal.py::test_faster_whisper_real_model" whisper.log

      - name: Test suite
        run: docker run --rm theme5 python -m pytest -q -p no:cacheprovider tests viewer

      - name: Demo
        run: docker run --rm theme5

      - name: Bench with kit hints vs raw media (Whisper + OCR)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          python3 -m pip install -q pillow==12.3.0
          python3 -m bench.real_media bench/scenarios60 /tmp/real60
          python3 -m bench.real_media scenarios /tmp/real9
          chmod -R a+rX /tmp/real60 /tmp/real9
          docker run --rm -v /tmp/real60:/data/real60:ro -v /tmp/real9:/data/real9:ro theme5 bash -c '
            set -e
            echo "== bench60, kit transcripts/labels";  python -m bench.run_suite bench/scenarios60 --agent theme5.agent:Agent --out /tmp/b1 | sed -n "/^MEAN/,/^SUITE/p"
            echo "== bench60, raw media only";          python -m bench.run_suite /data/real60 --agent theme5.agent:Agent --strip-oracle --out /tmp/b2 | sed -n "/^scenario/,/^SUITE/p"
            echo "== public-style 9, raw media only";   python -m sim.run /data/real9 --strip-oracle --out /tmp/b3 | tail -12'

      - name: Image size
        if: always()
        run: docker image ls theme5
